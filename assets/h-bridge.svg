<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">Como funciona uma ponte H</title><desc id="desc">Circuito conceitual com quatro chaves. Q1 e Q4 fechadas alimentam o motor em um sentido. Q3 e Q2 fechadas invertem o sentido. Nunca fechar simultaneamente as duas chaves da mesma coluna.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#7436db"/></marker><style>text{font-family:Arial,sans-serif;fill:#2c1c43;font-size:21px}.title{font-size:32px;font-weight:700}.small{font-size:18px}.line{fill:none;stroke:#b9b0c9;stroke-width:5;stroke-linecap:round}.active{fill:none;stroke:#7436db;stroke-width:6;stroke-linecap:round}.label{font-weight:700}</style></defs><rect width="1200" height="850" rx="24" fill="#fff"/><text x="55" y="65" class="title">Ponte H: a corrente escolhe o sentido</text><text x="55" y="100" class="small">Modelo conceitual. No L298N, os transistores e a lógica estão dentro do circuito integrado.</text>
<path class="line" d="M330 160H770M550 140V160M330 160V230M770 160V230M330 280V425M770 280V425M330 475V545H770V475M550 545V570M330 350H488M612 350H770"/>
<path class="active" d="M550 140V160H330V230M330 280V350H488M612 350H770V425M770 475V545H550V570"/>
<circle cx="330" cy="230" r="7" fill="#7436db"/><circle cx="330" cy="280" r="7" fill="#7436db"/><path d="M330 230V280" class="active"/>
<circle cx="770" cy="425" r="7" fill="#7436db"/><circle cx="770" cy="475" r="7" fill="#7436db"/><path d="M770 425V475" class="active"/>
<circle cx="770" cy="230" r="7" fill="#b9b0c9"/><circle cx="770" cy="280" r="7" fill="#b9b0c9"/><path d="M770 280 800 235" class="line"/>
<circle cx="330" cy="425" r="7" fill="#b9b0c9"/><circle cx="330" cy="475" r="7" fill="#b9b0c9"/><path d="M330 475 360 430" class="line"/>
<circle cx="550" cy="350" r="62" fill="#f1eafa" stroke="#7436db" stroke-width="5"/><text x="550" y="361" text-anchor="middle" style="font-size:32px;font-weight:700">M</text><path d="M400 330H467M635 330H712" stroke="#7436db" stroke-width="3" marker-end="url(#arr)"/>
<text x="580" y="147" class="label">+ Vmotor</text><text x="580" y="579">GND</text><path d="M525 580H575M533 590H567M543 600H557" stroke="#2c1c43" stroke-width="3"/>
<text x="260" y="253" text-anchor="end" class="label">Q1</text><text x="260" y="280" text-anchor="end" class="small">fechada</text><text x="840" y="253" class="label">Q3</text><text x="840" y="280" class="small">aberta</text><text x="260" y="450" text-anchor="end" class="label">Q2</text><text x="260" y="477" text-anchor="end" class="small">aberta</text><text x="840" y="450" class="label">Q4</text><text x="840" y="477" class="small">fechada</text>
<rect x="55" y="640" width="527" height="87" rx="15" fill="#f0e8fc"/><text x="80" y="675" class="label">Sentido A</text><text x="80" y="706">Q1 + Q4 fechadas; Q2 + Q3 abertas.</text><rect x="598" y="640" width="547" height="87" rx="15" fill="#e9faff"/><text x="623" y="675" class="label">Sentido B</text><text x="623" y="706">Q3 + Q2 fechadas; Q1 + Q4 abertas.</text>
<text x="55" y="774" class="label">Nunca feche Q1 + Q2 ou Q3 + Q4 ao mesmo tempo.</text><text x="55" y="805" class="small">Isso liga a alimentação ao GND por um curto-circuito. O PWM controla a potência média no motor.</text></svg>
