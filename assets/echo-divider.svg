<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">Divisor de tensão para o ECHO do HC-SR04</title><desc id="desc">ECHO de 5 volts passa por resistor de um quilo-ohm até um nó ligado ao GPIO34. Do mesmo nó, resistor de dois quilo-ohms vai ao GND. Saída nominal de 3,33 volts com entrada de 5 volts.</desc><style>text{font-family:Arial,sans-serif;fill:#302044;font-size:22px}.head{font-size:32px;font-weight:700}.small{font-size:19px}</style><rect width="1200" height="540" rx="22" fill="#fff"/><text x="45" y="60" class="head">ECHO de 5 V → entrada do ESP32</text><text x="45" y="97" class="small">Um divisor resistivo evita a ligação direta de 5 V ao GPIO.</text><path d="M90 225H260M390 225H940M580 225V290M580 380V420" stroke="#7436db" stroke-width="5" fill="none"/><rect x="260" y="207" width="130" height="36" rx="4" fill="#f0e8fc" stroke="#7436db" stroke-width="3"/><rect x="562" y="290" width="36" height="90" rx="4" fill="#f0e8fc" stroke="#7436db" stroke-width="3"/><circle cx="580" cy="225" r="8" fill="#04a7c7"/><text x="90" y="185">HC-SR04 ECHO</text><text x="278" y="283">R1 = 1 kΩ</text><text x="630" y="346">R2 = 2 kΩ</text><text x="830" y="184">GPIO34</text><text x="845" y="268">≈ 3,33 V</text><path d="M550 420H610M560 432H600M570 444H590" stroke="#302044" stroke-width="4"/><text x="640" y="433">GND comum</text><text x="45" y="492" class="small">Vout = Vin × R2 / (R1 + R2). Use resistores de 1% e confira Vout; se a alimentação variar, use um conversor de nível.</text></svg>
