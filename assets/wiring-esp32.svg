<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1180" viewBox="0 0 1400 1180" role="img" aria-labelledby="title desc"><title id="title">Ligações do ESP32 DevKit com L298N</title><desc id="desc">Diagrama lógico de sinais, sensores e alimentação. As posições gráficas não representam a ordem física dos conectores.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#302044;font-size:21px}.title{font-size:34px;font-weight:700}.head{font-size:25px;font-weight:700}.small{font-size:18px}.note{font-size:19px}.bold{font-weight:700}</style></defs><rect width="1400" height="1180" rx="24" fill="#fff"/><text x="50" y="58" class="title">ESP32 DevKit + L298N</text><text x="50" y="95" class="small">Diagrama lógico autoral • confira os nomes impressos na sua placa, não a posição dos pinos nesta imagem.</text>
 <rect x="50" y="140" width="320" height="380" rx="19" fill="#f4eefc" stroke="#d6c5ed" stroke-width="2"/><text x="78" y="181" class="head">ESP32 DevKit</text><text x="78" y="211" class="small">Sinais de controle</text>
 <rect x="605" y="140" width="300" height="380" rx="19" fill="#f8f6fc" stroke="#d6c5ed" stroke-width="2"/><text x="633" y="181" class="head">L298N</text><text x="633" y="211" class="small">Retire jumpers ENA e ENB</text>
 <rect x="1085" y="183" width="265" height="125" rx="18" fill="#eafaff" stroke="#b5e9f3" stroke-width="2"/><text x="1110" y="224" class="head">Motor esquerdo</text><text x="1110" y="258">OUT1 + OUT2</text><rect x="1085" y="357" width="265" height="125" rx="18" fill="#eafaff" stroke="#b5e9f3" stroke-width="2"/><text x="1110" y="398" class="head">Motor direito</text><text x="1110" y="432">OUT3 + OUT4</text>
 <path d="M905 246H1085M905 266H1085M905 420H1085M905 440H1085" fill="none" stroke="#04a7c7" stroke-width="4"/><text x="945" y="231" class="small">Canal A</text><text x="945" y="405" class="small">Canal B</text><text x="80" y="259" class="bold">GPIO25</text><circle cx="370" cy="252" r="5" fill="#7436db"/><path d="M370 252H605" stroke="#7436db" stroke-width="3"/><circle cx="605" cy="252" r="5" fill="#7436db"/><text x="635" y="259" class="bold">ENA</text><text x="80" y="303" class="bold">GPIO26</text><circle cx="370" cy="296" r="5" fill="#04a7c7"/><path d="M370 296H605" stroke="#04a7c7" stroke-width="3"/><circle cx="605" cy="296" r="5" fill="#04a7c7"/><text x="635" y="303" class="bold">ENB</text><text x="80" y="347" class="bold">GPIO18</text><circle cx="370" cy="340" r="5" fill="#543096"/><path d="M370 340H605" stroke="#543096" stroke-width="3"/><circle cx="605" cy="340" r="5" fill="#543096"/><text x="635" y="347" class="bold">IN1</text><text x="80" y="391" class="bold">GPIO19</text><circle cx="370" cy="384" r="5" fill="#543096"/><path d="M370 384H605" stroke="#543096" stroke-width="3"/><circle cx="605" cy="384" r="5" fill="#543096"/><text x="635" y="391" class="bold">IN2</text><text x="80" y="435" class="bold">GPIO21</text><circle cx="370" cy="428" r="5" fill="#0092b3"/><path d="M370 428H605" stroke="#0092b3" stroke-width="3"/><circle cx="605" cy="428" r="5" fill="#0092b3"/><text x="635" y="435" class="bold">IN3</text><text x="80" y="479" class="bold">GPIO22</text><circle cx="370" cy="472" r="5" fill="#0092b3"/><path d="M370 472H605" stroke="#0092b3" stroke-width="3"/><circle cx="605" cy="472" r="5" fill="#0092b3"/><text x="635" y="479" class="bold">IN4</text><text x="50" y="558" class="head">Sensores</text><rect x="50" y="580" width="1300" height="250" rx="18" fill="#f9f8fc" stroke="#e6dfef"/>
 <text x="78" y="619" class="bold">Componente</text><text x="405" y="619" class="bold">Sinal</text><text x="760" y="619" class="bold">Alimentação / observação</text><path d="M78 636H1322" stroke="#ddd4e8"/><text x="78" y="674">HC-SR04</text><text x="405" y="674">TRIG → GPIO23</text><text x="760" y="674">VCC → 5 V; GND comum.</text>
 <text x="78" y="711">HC-SR04</text><text x="405" y="711">ECHO → divisor → GPIO34</text><text x="760" y="711">Nunca aplique ECHO de 5 V direto.</text>
 <text x="78" y="748">Linha esquerda</text><text x="405" y="748">OUT → GPIO32</text><text x="760" y="748">Sensor compatível com sinais de 3,3 V.</text>
 <text x="78" y="785">Linha direita</text><text x="405" y="785">OUT → GPIO33</text><text x="760" y="785">Se OUT for 5 V, adapte o nível.</text><text x="50" y="875" class="head">Alimentação</text><rect x="50" y="898" width="1300" height="164" rx="18" fill="#f2eafb"/>
 <text x="77" y="934" class="bold">Bateria 2S protegida → fusível + chave → dois reguladores</text>
 <text x="77" y="972">Ramo dos motores: buck ajustado para a tensão prevista → Vmotor do L298N.</text>
 <text x="77" y="1008">Ramo da lógica: buck de 5 V → 5V do L298N (retire 5V-EN) e entrada 5V da placa*.</text>
 <text x="77" y="1044" class="bold">Todos os GND devem estar interligados. Nunca alimente os motores por um pino da placa.</text>
 <text x="50" y="1101" class="note">* Uno: pino 5V regulado; ESP32: entrada 5V/VIN conforme sua placa. Não use a entrada de 3,3 V.</text>
 <text x="50" y="1135" class="note">Desconecte a alimentação externa da placa antes de conectar USB. Confira polaridade e tensão com multímetro.</text></svg>