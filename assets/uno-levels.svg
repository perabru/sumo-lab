<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1150" viewBox="0 0 1400 1150" role="img" aria-labelledby="title desc"><title id="title">Seis divisores entre Arduino Uno e L298N alimentado em 6 volts</title><desc id="desc">Cada sinal passa por um resistor de um quilo-ohm. Da entrada correspondente do L298N, um resistor de um vírgula cinco quilo-ohms é ligado ao GND comum. Os seis divisores independentes reduzem sinais de cinco volts para aproximadamente três volts.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#302044;font-size:22px}.head{font-size:34px;font-weight:700}.label{font-weight:700}.small{font-size:19px}.wire{fill:none;stroke:#7436db;stroke-width:4;stroke-linecap:round}</style></defs><rect width="1400" height="1150" rx="24" fill="#fff"/><text x="50" y="60" class="head">Uno + L298N com Vmotor regulado em 6 V</text><text x="50" y="100" class="small">Adapte os seis sinais de 5 V para aproximadamente 3 V. Cada entrada recebe seu próprio divisor.</text>
<rect x="50" y="135" width="1300" height="98" rx="16" fill="#f2eafb"/><text x="75" y="174" class="label">Por que reduzir o nível?</text><text x="75" y="209">A condição do L298 exige Vs ≥ ViH + 2,5 V. Com Vs = 6 V, um sinal de 5 V não atende essa condição.</text>
<!-- One complete divider schematic -->
<text x="50" y="289" class="label">Repita este circuito para cada sinal da tabela</text><text x="80" y="350" class="label">Pino do Uno</text><text x="80" y="382" class="small">Sinal de 0 ou 5 V</text><path d="M90 422H360M510 422H1090M745 422V485M745 565V602" class="wire"/><rect x="360" y="401" width="150" height="42" rx="5" fill="#f2eafb" stroke="#7436db" stroke-width="3"/><text x="435" y="386" text-anchor="middle" class="label">R1 = 1 kΩ</text><circle cx="745" cy="422" r="8" fill="#00abc9"/><rect x="724" y="485" width="42" height="80" rx="4" fill="#e9faff" stroke="#00abc9" stroke-width="3"/><text x="790" y="521" class="label">R2 = 1,5 kΩ</text><text x="790" y="553" class="small">Da entrada ao GND</text><path d="M715 602H775M725 615H765M735 628H755" stroke="#302044" stroke-width="4"/><text x="790" y="618">GND comum</text><text x="985" y="350" class="label">Entrada do L298N</text><text x="985" y="382" class="small">Sinal de 0 ou ≈ 3 V</text><text x="80" y="490" class="small">Não una as seis entradas.</text><text x="80" y="524" class="small">Os GND podem compartilhar</text><text x="80" y="554" class="small">o mesmo barramento.</text>
<!-- Mapping table -->
<rect x="50" y="677" width="1300" height="280" rx="16" fill="#f9f8fc" stroke="#e2d7ef"/><path d="M75 737H1325M75 802H1325M75 867H1325M700 702V932" stroke="#ddd3e9" stroke-width="2"/>
<text x="80" y="717" class="label">Uno → divisor independente → L298N</text><text x="730" y="717" class="label">Uno → divisor independente → L298N</text>
<text x="80" y="778">D5 (PWM) → 1 kΩ / 1,5 kΩ → ENA</text><text x="730" y="778">D6 (PWM) → 1 kΩ / 1,5 kΩ → ENB</text>
<text x="80" y="843">D10 → 1 kΩ / 1,5 kΩ → IN1</text><text x="730" y="843">D11 → 1 kΩ / 1,5 kΩ → IN2</text>
<text x="80" y="908">D9 → 1 kΩ / 1,5 kΩ → IN3</text><text x="730" y="908">D8 → 1 kΩ / 1,5 kΩ → IN4</text>
<text x="50" y="1004" class="label">Use 6 resistores de 1 kΩ + 6 resistores de 1,5 kΩ, preferencialmente 1%.</text><text x="50" y="1042" class="small">Vout = Vin × 1,5 / (1 + 1,5). Com Vin = 5 V, Vout ≈ 3 V. Confira a montagem antes de alimentar.</text><text x="50" y="1080" class="small">Remova os jumpers ENA e ENB. Com lógica de 5 V regulada externamente, retire também o jumper 5V-EN.</text><text x="50" y="1116" class="small">Nunca conecte os seis pinos de 5 V diretamente às entradas do L298N nesta alimentação de motores em 6 V.</text></svg>
