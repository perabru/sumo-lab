<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc"><title id="title">Montagem do robô de sumô em camadas</title><desc id="desc">Vista explodida autoral com controladora, ponte H, espaçadores, bateria presa ao centro, chassi, dois motores com rodas, sensores de linha e lâmina frontal.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#302044;font-size:22px}.title{font-size:32px;font-weight:700}.label{font-weight:700}.small{font-size:18px}.leader{fill:none;stroke:#8a6db2;stroke-width:2}</style><linearGradient id="chassis" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ded4ed"/></linearGradient></defs><rect width="1200" height="1020" rx="24" fill="#fff"/><text x="45" y="58" class="title">A montagem, por camadas</text><text x="45" y="94" class="small">Ilustração de organização • adapte suportes e furos às medidas reais do seu chassi.</text>
