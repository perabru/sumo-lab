<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1180" viewBox="0 0 1400 1180" role="img" aria-labelledby="title desc"><title id="title">Ligações do Arduino Uno R3 com L298N</title><desc id="desc">Diagrama lógico de sinais, sensores e alimentação. As posições gráficas não representam a ordem física dos conectores.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#302044;font-size:21px}.title{font-size:34px;font-weight:700}.head{font-size:25px;font-weight:700}.small{font-size:18px}.note{font-size:19px}.bold{font-weight:700}</style></defs><rect width="1400" height="1180" rx="24" fill="#fff"/><text x="50" y="58" class="title">Arduino Uno R3 + L298N</text><text x="50" y="95" class="small">Diagrama lógico autoral • confira os nomes impressos na sua placa, não a posição dos pinos nesta imagem.</text>
 <rect x="50" y="140" width="320" height="380" rx="19" fill="#f4eefc" stroke="#d6c5ed" stroke-width="2"/><text x="78" y="181" class="head">Arduino Uno R3</text><text x="78" y="211" class="small">Sinais de 5 V → divisores → 3 V</text>
 <rect x="605" y="140" width="300" height="380" rx="19" fill="#f8f6fc" stroke="#d6c5ed" stroke-width="2"/><text x="633" y="181" class="head">L298N</text><text x="633" y="211" class="small">Retire jumpers ENA e ENB</text>
 <rect x="1085" y="183" width="265" height="125" rx="18" fill="#eafaff" stroke="#b5e9f3" stroke-width="2"/><text x="1110" y="224" class="head">Motor esquerdo</text><text x="1110" y="258">OUT1 + OUT2</text><rect x="1085" y="357" width="265" height="125" rx="18" fill="#eafaff" stroke="#b5e9f3" stroke-width="2"/><text x="1110" y="398" class="head">Motor direito</text><text x="1110" y="432">OUT3 + OUT4</text>
 <path d="M905 246H1085M905 266H1085M905 420H1085M905 440H1085" fill="none" stroke="#04a7c7" stroke-width="4"/><text x="945" y="231" class="small">Canal A</text><text x="945" y="405" class="small">Canal B</text><text x="80" y="259" class="bold">D5 (PWM)</text><circle cx="370" cy="252" r="5" fill="#7436db"/><path d="M370 252H412M477 252H605M525 252V261" stroke="#7436db" stroke-width="3" fill="none"/><rect x="412" y="240" width="65" height="24" rx="4" fill="#fff" stroke="#7436db" stroke-width="2"/><text x="444" y="258" text-anchor="middle" style="font-size:16px">1 kΩ</text><circle cx="525" cy="252" r="4" fill="#7436db"/><rect x="518" y="261" width="14" height="13" fill="#fff" stroke="#7436db" stroke-width="2"/><path d="M525 274V280M514 280H536M518 284H532M522 288H528" stroke="#7436db" stroke-width="2" fill="none"/><text x="542" y="278" style="font-size:16px">1,5 kΩ</text><circle cx="605" cy="252" r="5" fill="#7436db"/><text x="635" y="259" class="bold">ENA</text><text x="80" y="303" class="bold">D6 (PWM)</text><circle cx="370" cy="296" r="5" fill="#04a7c7"/><path d="M370 296H412M477 296H605M525 296V305" stroke="#04a7c7" stroke-width="3" fill="none"/><rect x="412" y="284" width="65" height="24" rx="4" fill="#fff" stroke="#04a7c7" stroke-width="2"/><text x="444" y="302" text-anchor="middle" style="font-size:16px">1 kΩ</text><circle cx="525" cy="296" r="4" fill="#04a7c7"/><rect x="518" y="305" width="14" height="13" fill="#fff" stroke="#04a7c7" stroke-width="2"/><path d="M525 318V324M514 324H536M518 328H532M522 332H528" stroke="#04a7c7" stroke-width="2" fill="none"/><text x="542" y="322" style="font-size:16px">1,5 kΩ</text><circle cx="605" cy="296" r="5" fill="#04a7c7"/><text x="635" y="303" class="bold">ENB</text><text x="80" y="347" class="bold">D10</text><circle cx="370" cy="340" r="5" fill="#543096"/><path d="M370 340H412M477 340H605M525 340V349" stroke="#543096" stroke-width="3" fill="none"/><rect x="412" y="328" width="65" height="24" rx="4" fill="#fff" stroke="#543096" stroke-width="2"/><text x="444" y="346" text-anchor="middle" style="font-size:16px">1 kΩ</text><circle cx="525" cy="340" r="4" fill="#543096"/><rect x="518" y="349" width="14" height="13" fill="#fff" stroke="#543096" stroke-width="2"/><path d="M525 362V368M514 368H536M518 372H532M522 376H528" stroke="#543096" stroke-width="2" fill="none"/><text x="542" y="366" style="font-size:16px">1,5 kΩ</text><circle cx="605" cy="340" r="5" fill="#543096"/><text x="635" y="347" class="bold">IN1</text><text x="80" y="391" class="bold">D11</text><circle cx="370" cy="384" r="5" fill="#543096"/><path d="M370 384H412M477 384H605M525 384V393" stroke="#543096" stroke-width="3" fill="none"/><rect x="412" y="372" width="65" height="24" rx="4" fill="#fff" stroke="#543096" stroke-width="2"/><text x="444" y="390" text-anchor="middle" style="font-size:16px">1 kΩ</text><circle cx="525" cy="384" r="4" fill="#543096"/><rect x="518" y="393" width="14" height="13" fill="#fff" stroke="#543096" stroke-width="2"/><path d="M525 406V412M514 412H536M518 416H532M522 420H528" stroke="#543096" stroke-width="2" fill="none"/><text x="542" y="410" style="font-size:16px">1,5 kΩ</text><circle cx="605" cy="384" r="5" fill="#543096"/><text x="635" y="391" class="bold">IN2</text><text x="80" y="435" class="bold">D9</text><circle cx="370" cy="428" r="5" fill="#0092b3"/><path d="M370 428H412M477 428H605M525 428V437" stroke="#0092b3" stroke-width="3" fill="none"/><rect x="412" y="416" width="65" height="24" rx="4" fill="#fff" stroke="#0092b3" stroke-width="2"/><text x="444" y="434" text-anchor="middle" style="font-size:16px">1 kΩ</text><circle cx="525" cy="428" r="4" fill="#0092b3"/><rect x="518" y="437" width="14" height="13" fill="#fff" stroke="#0092b3" stroke-width="2"/><path d="M525 450V456M514 456H536M518 460H532M522 464H528" stroke="#0092b3" stroke-width="2" fill="none"/><text x="542" y="454" style="font-size:16px">1,5 kΩ</text><circle cx="605" cy="428" r="5" fill="#0092b3"/><text x="635" y="435" class="bold">IN3</text><text x="80" y="479" class="bold">D8</text><circle cx="370" cy="472" r="5" fill="#0092b3"/><path d="M370 472H412M477 472H605M525 472V481" stroke="#0092b3" stroke-width="3" fill="none"/><rect x="412" y="460" width="65" height="24" rx="4" fill="#fff" stroke="#0092b3" stroke-width="2"/><text x="444" y="478" text-anchor="middle" style="font-size:16px">1 kΩ</text><circle cx="525" cy="472" r="4" fill="#0092b3"/><rect x="518" y="481" width="14" height="13" fill="#fff" stroke="#0092b3" stroke-width="2"/><path d="M525 494V500M514 500H536M518 504H532M522 508H528" stroke="#0092b3" stroke-width="2" fill="none"/><text x="542" y="498" style="font-size:16px">1,5 kΩ</text><circle cx="605" cy="472" r="5" fill="#0092b3"/><text x="635" y="479" class="bold">IN4</text><text x="50" y="558" class="head">Sensores</text><rect x="50" y="580" width="1300" height="250" rx="18" fill="#f9f8fc" stroke="#e6dfef"/>
 <text x="78" y="619" class="bold">Componente</text><text x="405" y="619" class="bold">Sinal</text><text x="760" y="619" class="bold">Alimentação / observação</text><path d="M78 636H1322" stroke="#ddd4e8"/><text x="78" y="674">HC-SR04</text><text x="405" y="674">TRIG → D2; ECHO → D3</text><text x="760" y="674">VCC → 5 V; GND comum.</text>
 <text x="78" y="716">Linha esquerda</text><text x="405" y="716">OUT digital → D12</text><text x="760" y="716">Módulo digital compatível com 5 V.</text>
 <text x="78" y="758">Linha direita</text><text x="405" y="758">OUT digital → D13</text><text x="760" y="758">Teste se a borda corresponde a LOW ou HIGH.</text>
 <text x="78" y="801" class="small">Instale os sensores de linha na frente, próximos do chão. Faça o primeiro teste com as rodas suspensas.</text><text x="50" y="875" class="head">Alimentação</text><rect x="50" y="898" width="1300" height="164" rx="18" fill="#f2eafb"/>
 <text x="77" y="934" class="bold">Bateria 2S protegida → fusível + chave → dois reguladores</text>
 <text x="77" y="972">Ramo dos motores: buck regulado em 6 V → Vmotor do L298N (há queda de tensão até os motores).</text>
 <text x="77" y="1008">Ramo da lógica: buck de 5 V → 5V do L298N (retire 5V-EN) e entrada 5V da placa*.</text>
 <text x="77" y="1044" class="bold">Todos os GND interligados, incluindo os seis divisores. Motores nunca ligados aos pinos da placa.</text>
 <text x="50" y="1101" class="note">* Uno: pino 5V regulado. Com Vmotor de 6 V, use os seis divisores de 1 kΩ / 1,5 kΩ (1%).</text>
 <text x="50" y="1135" class="note">Nunca ligue os seis sinais de 5 V direto ao L298N neste circuito. Desligue a alimentação externa antes do USB.</text></svg>